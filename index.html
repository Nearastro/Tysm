<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RBXM Cloud Uploader</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#101114;color:#eee;min-height:100vh;padding:20px}
.wrap{max-width:620px;margin:auto}.card{background:#181a1f;border:1px solid #2a2d34;border-radius:18px;padding:20px;margin-top:14px;box-shadow:0 10px 35px #0005}
h1{font-size:25px;margin:0 0 6px}p{color:#aeb3bd;line-height:1.5}.grid{display:grid;gap:12px}
label{font-size:13px;color:#b9bec8}input,select,textarea,button{width:100%;border-radius:11px;border:1px solid #30343c;background:#111318;color:#fff;padding:12px;font:inherit}
button{cursor:pointer;background:#fff;color:#111;font-weight:700;border:0}button.secondary{background:#24272e;color:#fff;border:1px solid #363a43}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{padding:12px;border-radius:11px;background:#111318;color:#bfc4ce;white-space:pre-wrap;word-break:break-word}
small{color:#8e949f}.hidden{display:none}.ok{color:#7ee787}.err{color:#ff7b72}
a{color:#8ab4ff}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>RBXM Cloud Uploader</h1>
<p>Upload <b>.rbxm</b> / <b>.rbxmx</b> langsung ke Roblox Open Cloud dari browser. File tidak dikirim ke server uploader ini.</p>
<div class="grid">
<div>
<label>Roblox OAuth Client ID</label>
<input id="clientId" placeholder="Masukkan Client ID aplikasi Roblox">
<small>Client ID didapat saat membuat OAuth 2.0 App di Creator Dashboard.</small>
</div>
<div class="row">
<button id="login">Login / Authorize Roblox</button>
<button id="logout" class="secondary">Clear Session</button>
</div>
<div>
<label>Jenis asset</label>
<select id="assetType"><option value="Model">Model</option><option value="Animation">Animation</option></select>
</div>
<div><label>Nama</label><input id="name" placeholder="Nama asset"></div>
<div><label>Deskripsi</label><textarea id="desc" rows="3" placeholder="Opsional"></textarea></div>
<div><label>File RBXM/RBXMX (maks. 20 MB)</label><input id="file" type="file" accept=".rbxm,.rbxmx"></div>
<button id="upload">Upload ke Roblox</button>
<div id="status" class="status">Belum login.</div>
</div>
</div>
<div class="card">
<b>Redirect URI</b>
<p id="redirect"></p>
<small>URI ini harus didaftarkan persis di Roblox OAuth App.</small>
</div>
</div>
<script>
const REDIRECT=location.origin+location.pathname;
document.querySelector('#redirect').textContent=REDIRECT;
const $=id=>document.getElementById(id);
const status=t=>{$('status').textContent=t};

function b64url(bytes){let s='';bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function randomString(n=64){const a=new Uint8Array(n);crypto.getRandomValues(a);return b64url(a)}
async function challenge(v){const d=new TextEncoder().encode(v);const h=await crypto.subtle.digest('SHA-256',d);return b64url(new Uint8Array(h))}
function save(k,v){sessionStorage.setItem(k,v)} function get(k){return sessionStorage.getItem(k)}

async function login(){
 const client=$('clientId').value.trim(); if(!client)return status('Isi Client ID dulu.');
 const verifier=randomString(64), state=randomString(32), ch=await challenge(verifier);
 save('pkce_verifier',verifier); save('oauth_state',state); save('client_id',client);
 const u=new URL('https://apis.roblox.com/oauth/v1/authorize');
 u.searchParams.set('client_id',client);u.searchParams.set('redirect_uri',REDIRECT);
 u.searchParams.set('scope','openid profile asset:read asset:write');
 u.searchParams.set('response_type','code');u.searchParams.set('code_challenge',ch);
 u.searchParams.set('code_challenge_method','S256');u.searchParams.set('state',state);
 location.href=u;
}
async function callback(){
 const q=new URLSearchParams(location.search), code=q.get('code'), state=q.get('state');
 if(!code)return;
 if(state!==get('oauth_state'))return status('OAuth state tidak cocok. Ulangi login.');
 status('Menukar authorization code...');
 const body=new URLSearchParams({grant_type:'authorization_code',client_id:get('client_id'),code,code_verifier:get('pkce_verifier'),redirect_uri:REDIRECT});
 const r=await fetch('https://apis.roblox.com/oauth/v1/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});
 const j=await r.json(); if(!r.ok)throw new Error(JSON.stringify(j));
 save('access_token',j.access_token); if(j.refresh_token)save('refresh_token',j.refresh_token);
 history.replaceState({},'',REDIRECT); status('Login berhasil. Token disimpan hanya di session browser.');
}
async function upload(){
 const token=get('access_token'); if(!token)return status('Login dulu.');
 const f=$('file').files[0]; if(!f)return status('Pilih file RBXM/RBXMX.');
 if(f.size>20*1024*1024)return status('File lebih besar dari 20 MB.');
 const name=$('name').value.trim()||f.name.replace(/\.(rbxm|rbxmx)$/i,'');
 const request={assetType:$('assetType').value,displayName:name,description:$('desc').value,creationContext:{creator:{}}};
 const form=new FormData();
 form.append('request',JSON.stringify(request));
 form.append('fileContent',f,'asset.rbxm');
 status('Uploading...');
 const r=await fetch('https://apis.roblox.com/assets/v1/assets',{method:'POST',headers:{Authorization:'Bearer '+token},body:form});
 const j=await r.json(); if(!r.ok)throw new Error(JSON.stringify(j));
 status('Upload diterima.\n'+JSON.stringify(j,null,2)+'\n\nCek status operation untuk Asset ID.');
}
$('login').onclick=()=>login().catch(e=>status('Error: '+e.message));
$('logout').onclick=()=>{sessionStorage.clear();status('Session dibersihkan.')};
$('upload').onclick=()=>upload().catch(e=>status('Error: '+e.message));
callback().catch(e=>status('OAuth error: '+e.message));
</script>
</body></html>
